openapi: "3.0.2"
info:
  title: Example Rest Archetype
  version: 0.0.1

tags:
  - name: User
    description: Operation concerning Users
    externalDocs:
      url: http://giacomino.com/user
  - name: Category
    description: Operation concerning Categories
    externalDocs:
      url: http://giacomino.com/category


paths:
  /example:
    get:
      tags:
        - Example
      summary: An example endpoint
      description: An example endpoint
      operationId: example
      responses:
        "200":
          description: "hello world"

#####################################
####### User Endpoints ##############
#####################################
  /users:
    get:
      tags:
        - User
      summary: Gets all User
      description: Gets all users present.
      operationId: getUsers
      x-spring-provide-args: ['@org.springframework.security.core.annotation.AuthenticationPrincipal ApplicationUser applicationUser']
      x-spring-paginated: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/error400"
        "401":
          $ref: "#/components/responses/error401"
        "403":
          $ref: "#/components/responses/error403"
        "404":
          $ref: "#/components/responses/error404"
        "500":
          $ref: "#/components/responses/error500"

  /users/{id}:
    get:
      tags:
        - User
      summary: Get User with respective ID
      description: Get user by his ID.
      operationId: getUserId
      x-spring-provide-args: ['@org.springframework.security.core.annotation.AuthenticationPrincipal ApplicationUser applicationUser']
      parameters:
        - $ref: "#/components/parameters/findById"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/error400"
        "401":
          $ref: "#/components/responses/error401"
        "403":
          $ref: "#/components/responses/error403"
        "404":
          $ref: "#/components/responses/error404"
        "500":
          $ref: "#/components/responses/error500"

#####################################
####### Category Endpoints ##########
#####################################

  /category:
    get:
      tags:
        - Category
      summary: Gets all Category
      description: Gets all categories present.
      operationId: getCategory
      x-spring-provide-args: [ '@org.springframework.security.core.annotation.AuthenticationPrincipal ApplicationUser applicationUser' ]
      x-spring-paginated: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/error400"
        "401":
          $ref: "#/components/responses/error401"
        "403":
          $ref: "#/components/responses/error403"
        "404":
          $ref: "#/components/responses/error404"
        "500":
          $ref: "#/components/responses/error500"

    post:
      tags:
        - Category
      summary: Creates a category
      description: Creates a new category.
      operationId: createCategory
      x-spring-provide-args: [ '@org.springframework.security.core.annotation.AuthenticationPrincipal ApplicationUser applicationUser' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "201":
          description: Category successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/error400"
        "401":
          $ref: "#/components/responses/error401"
        "403":
          $ref: "#/components/responses/error403"
        "500":
          $ref: "#/components/responses/error500"

  /category/{id}:
    get:
      tags:
        - Category
      summary: Get Category with respective ID
      description: Get category by his ID.
      operationId: getCategoryId
      x-spring-provide-args: [ '@org.springframework.security.core.annotation.AuthenticationPrincipal ApplicationUser applicationUser' ]
      parameters:
        - $ref: "#/components/parameters/findById"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/error400"
        "401":
          $ref: "#/components/responses/error401"
        "403":
          $ref: "#/components/responses/error403"
        "404":
          $ref: "#/components/responses/error404"
        "500":
          $ref: "#/components/responses/error500"

    put:
      tags:
        - Category
      summary: Updates a category
      description: Updates an existing category.
      operationId: updateCategory
      x-spring-provide-args: [ '@org.springframework.security.core.annotation.AuthenticationPrincipal ApplicationUser applicationUser' ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/error400"
        "401":
          $ref: "#/components/responses/error401"
        "403":
          $ref: "#/components/responses/error403"
        "404":
          $ref: "#/components/responses/error404"
        "500":
          $ref: "#/components/responses/error500"

    delete:
      tags:
        - Category
      summary: Delete a category
      description: Delete an existing category.
      operationId: deleteCategory
      x-spring-provide-args: [ '@org.springframework.security.core.annotation.AuthenticationPrincipal ApplicationUser applicationUser' ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Category deleted successfully
        "400":
          $ref: "#/components/responses/error400"
        "401":
          $ref: "#/components/responses/error401"
        "403":
          $ref: "#/components/responses/error403"
        "404":
          $ref: "#/components/responses/error404"
        "500":
          $ref: "#/components/responses/error500"

components:
  parameters:
    findById:
      name: id
      in: path
      description: The ID of object to be returned
      required: true
      schema:
        minimum: 0
        type: integer
        format: int64
        default: 0

    findByName:
      name: name
      in: path
      description: The name of object to be returned
      required: true
      schema:
        type: string
        default: "name"

  responses:
    error500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    error400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    error404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 3
          maxLength: 20
        surname:
          type: string
          minLength: 3
          maxLength: 20
        username:
          type: string
          minLength: 3
          maxLength: 30
        password:
          type: string
          minLength: 6
          maxLength: 30
        email:
          type: string
          minLength: 3
          maxLength: 30
          format: email
        enabled:
          type: boolean
        locked:
          type: boolean
        roles:
          type: array
          items:
            type: string
      required:
        - name
        - surname
        - username
        - password

    Expense:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
          minLength: 3
          maxLength: 40
        amount:
          type: number
          format: double
        date:
          type: string
          format: date-time
        product:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        user:
          $ref: "#/components/schemas/User"

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 3
          maxLength: 40
        description:
          type: string
          minLength: 3
          maxLength: 40

    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 3
          maxLength: 40
        description:
          type: string
          minLength: 3
          maxLength: 40
        price:
          type: number
          format: double
        type:
          $ref: "#/components/schemas/Category"

    ProblemDetail:
      type: object

    ExampleModel:
      type: object
      properties:
        id:
          type: integer
          format: int64


